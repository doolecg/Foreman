appId: com.doolecg.foreman
productName: Foreman
copyright: Copyright © 2026 doolecg
directories:
  output: dist
  buildResources: build

files:
  # Only what the app loads: the main and preload bundles and the renderer. The CLI ships through
  # extraResources; demo and e2e screenshots and source maps stay out of the installer.
  - out/main/*.cjs
  - out/renderer/**
  - package.json
  - "!**/*.map"

extraResources:
  # The foreman skill plugin that operators load with --plugin-dir.
  - from: plugin
    to: plugin
  # The agents' `foreman` CLI and its wrappers, run with the app binary as Node.
  - from: out/cli
    to: cli
  - from: cli/bin
    to: cli
  # The Claude Code hook and status line script (dependency-free), run by the app binary as Node.
  - from: scripts/op-event.mjs
    to: claude-mods/op-event.mjs
  # The window and taskbar icon, loaded at runtime.
  - from: build/icon.png
    to: icon.png
  # Foreman's LICENSE and the third-party notices, written by scripts/notices.mjs during the build.
  - from: out/licenses
    to: licenses
  # The PowerShell helper for the Windows media controls; outside the asar so PowerShell can read it.
  - from: helper
    to: helper

# Native modules must be real files on disk.
asarUnpack:
  - node_modules/@lydell/node-pty*/**

npmRebuild: false

win:
  target:
    - target: msi
      arch: [x64]
  artifactName: Foreman-${version}-windows-${arch}.${ext}

msi:
  # oneClick: true skips the assisted wizard, so no install-folder page; perMachine installs to C:\Program Files\Foreman.
  oneClick: true
  perMachine: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Foreman

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  artifactName: Foreman-${version}-mac-${arch}.${ext}

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  maintainer: doolecg <doolecg@gmail.com>
  artifactName: Foreman-${version}-linux-${arch}.${ext}

publish: null
